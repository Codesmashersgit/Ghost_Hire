[build]
  command = "npm run build"
  publish = "frontend/dist"
  base = "frontend"

# Redirect all non-matching URLs to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Don't redirect actual files
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = false


